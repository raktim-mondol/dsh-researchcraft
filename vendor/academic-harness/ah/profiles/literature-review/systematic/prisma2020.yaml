  section: Results
  topic: Synthesis results
  text: Per-synthesis summary of characteristics and risk of bias among contributing studies.
- id: 20b
  section: Results
  topic: Synthesis results
  text: Results of all statistical syntheses conducted.
- id: 20c
  section: Results
  topic: Synthesis results
  text: Results of investigations into possible causes of heterogeneity.
- id: 20d
  section: Results
  topic: Synthesis results
  text: Results of sensitivity analyses assessing robustness.
- id: '21'
