checklist: PRISMA 2020 (27 items, 42 sub-items); item wording as abbreviated in the example manuscript's
  appendix S5
items:
- id: '1'
  section: null
  topic: Title
  text: Identify the report as a systematic review.
- id: '2'
  section: null
  topic: Abstract
  text: Abstract reporting the PRISMA~2020 for Abstracts elements (structured headings are not used).
- id: '3'
  section: Introduction
  topic: Rationale
  text: Rationale in the context of existing knowledge.
- id: '4'
  section: Introduction
  topic: Objectives
  text: Explicit objectives and research questions.
- id: '5'
  section: Methods
  topic: Eligibility criteria
  text: Inclusion/exclusion criteria and grouping for synthesis.
- id: '6'
  section: Methods
  topic: Information sources
  text: Databases, registers, reference lists; dates last searched.
- id: '7'
  section: Methods
  topic: Search strategy
  text: Full search strategies incl. filters and limits.
- id: '8'
  section: Methods
  topic: Selection process
  text: Reviewer numbers, independence, screening method.
- id: '9'
  section: Methods
  topic: Data collection process
  text: Reviewer numbers, independence, data confirmation.
- id: 10a
  section: Methods
  topic: Data items
  text: List and define all outcomes sought; specify whether all compatible results were sought and, if
    not, how the results to collect were decided.
- id: 10b
  section: Methods
  topic: Data items
  text: List and define all other variables sought (e.g. study/dataset characteristics); describe assumptions
    about missing or unclear information.
- id: '11'
  section: Methods
  topic: Study risk-of-bias assessment
  text: Tool, reviewers, independence.
- id: '12'
  section: Methods
  topic: Effect measures
  text: Not applicable---the review performs no quantitative meta-analysis (descriptive synthesis only).
- id: 13a
  section: Methods
  topic: Synthesis methods
  text: Processes used to decide which studies were eligible for each synthesis.
- id: 13b
  section: Methods
  topic: Synthesis methods
  text: Methods to prepare data for presentation/synthesis, incl. missing-statistic handling and conversions.
- id: 13c
  section: Methods
  topic: Synthesis methods
  text: Methods to tabulate or visually display results of individual studies and syntheses.
- id: 13d
  section: Methods
  topic: Synthesis methods
  text: Synthesis method and rationale; if meta-analysis, model/heterogeneity method/software.
- id: 13e
  section: Methods
  topic: Synthesis methods
  text: Methods used to explore possible causes of heterogeneity (e.g. subgroup analysis, meta-regression).
- id: 13f
  section: Methods
  topic: Synthesis methods
  text: Sensitivity analyses conducted to assess robustness of synthesized results.
- id: '14'
  section: Methods
  topic: Reporting-bias assessment
  text: Assessment of missing-result risk.
- id: '15'
  section: Methods
  topic: Certainty assessment
  text: Certainty/confidence assessment method.
- id: 16a
  section: Results
  topic: Study selection
  text: Numbers of records screened, assessed and included, ideally with a flow diagram.
- id: 16b
  section: Results
  topic: Study selection
  text: Cite studies that might appear to meet inclusion criteria but were excluded, with reasons.
- id: '17'
  section: Results
  topic: Study characteristics
  text: Cite each included study; characteristics.
- id: '18'
  section: Results
  topic: Risk of bias in studies
  text: RoB assessments per study.
- id: '19'
  section: Results
  topic: Results of individual studies
  text: Per-study findings and reported performance metrics.
