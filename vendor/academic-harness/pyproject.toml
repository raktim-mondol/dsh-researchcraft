[project]
name = "academic-harness"
version = "0.1.0"
description = "Engine for writing, revising and verifying academic documents in LaTeX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
keywords = ["latex", "academic", "harness", "audit"]

[project.urls]
Repository = "https://github.com/raktim-mondol/academic-harness"

[project.scripts]
ah = "ah.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
